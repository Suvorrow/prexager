[workspace]

resolver = "2"

members = [
    "crates/*",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
# readme = "README.md"
version = "0.1.0"

[workspace.dependencies]
image = "0.25.9"
thiserror = { version = "2", default-features = false }
tokio = { version = "1.51.1", features = ["rt", "macros"] }
serde = { version = "1.0.228", default-features = false, features = [
    "derive",
    "alloc",
]}
