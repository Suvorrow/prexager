[workspace]

resolver = "2"

members = [
    "crates/*",
    "crates/prexager-core",
    "crates/prexager-storage",
    "crates/prexager-vnu",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
# readme = "README.md"
version = "0.1.0"
description = "Deterministic cognitive system with asymmetric multi-agent validation for continuous autonomous AGI reasoning."

[workspace.dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
duckdb = { version = "1.5", features = ["vss", "json"] }
image = "0.25.9"
thiserror = { version = "2", default-features = false }
tokio = { version = "1.51.1", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0.229", default-features = false, features = [
    "derive",
    "alloc",
]}
serde_json = "1.0.151"
uuid = { version = "1.24", features = ["v4", "serde"] }

# ======== Internal Prexager crates ========
prexager-core = { path = "crates/prexager-core" }
prexager-storage = { path = "crates/prexager-storage" }
